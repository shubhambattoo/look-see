name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global 'npm@^11.5.1'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          set +e
          response="$(npm view "${package_name}@${package_version}" version 2>&1)"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "Version ${package_version} is already published; skipping publish."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [[ "$response" == *E404* || "$response" == *"404 Not Found"* ]]; then
            echo "Version ${package_version} is not published yet."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

      - name: Publish package
        if: steps.published.outputs.already_published == 'false'
        run: npm publish
